<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.ico">
<title>Solutions Journalism Network — Reports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #D34435;
    --teal: #30626B;
    --ink: #000000;
    --paper: #FFFFFF;
    --mist: #EEF3F4;
    --muted: #55686B;
    --line: #D8E2E4;
    --sans: Figtree, "Helvetica Neue", Arial, sans-serif;
    --serif: Lora, Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: var(--sans); color: var(--ink); background: var(--paper); line-height: 1.5; font-size: 16px; }
  button, input, textarea { font: inherit; }
  :focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* Buttons: SJN-style outlined red, with a filled version for the main action */
  .btn {
    border: 1.5px solid var(--red); background: var(--paper); color: var(--red);
    padding: .5rem 1rem; border-radius: 2px; font-weight: 500; font-size: .9rem; cursor: pointer;
  }
  .btn:hover { background: var(--red); color: var(--paper); }
  #signin-btn, #upload-go { background: var(--red); color: var(--paper); }
  #signin-btn:hover, #upload-go:hover { background: #B8392C; border-color: #B8392C; }
  .btn.ghost { border-color: var(--teal); color: var(--teal); }
  .btn.ghost:hover { background: var(--teal); color: var(--paper); }
  .btn.link { border: none; background: none; color: var(--teal); padding: .25rem .4rem; text-decoration: underline; text-underline-offset: 3px; }
  .btn.link:hover { color: var(--red); background: none; }
  .btn.link.danger { color: var(--red); }
  .btn:disabled { opacity: .55; cursor: wait; }

  /* Sign in */
  #signin { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; }
  #signin .panel-dark {
    background: var(--teal); color: var(--paper);
    padding: clamp(2rem, 6vw, 5rem);
    display: flex; flex-direction: column; justify-content: flex-end;
    border-top: 6px solid var(--red);
  }
  .wordmark { color: var(--paper); font-weight: 700; letter-spacing: .06em; line-height: 1.05; font-size: 1rem; margin-bottom: auto; }
  .wordmark span { display: block; font-weight: 400; }
  .logo-img { display: block; height: auto; }
  .panel-dark .logo-img { width: min(15rem, 70%); margin-bottom: auto; filter: brightness(0) invert(1); } /* turns the logo white on teal */
  header.bar .logo-img { width: 11rem; }
  .logo-fallback { display: none; }
  .logo-missing .logo-img { display: none; }
  .logo-missing .logo-fallback { display: block; }
  #signin .panel-dark h1 { font-weight: 500; font-size: clamp(2.8rem, 7vw, 5rem); line-height: 1.05; margin: 0 0 1rem; }
  #signin .panel-dark p { font-family: var(--serif); font-style: italic; max-width: 32ch; margin: 0; font-size: 1.15rem; line-height: 1.6; }
  #signin .panel-form { padding: clamp(2rem, 6vw, 5rem); display: flex; flex-direction: column; justify-content: center; max-width: 30rem; }
  #signin .panel-form h2 { color: var(--red); font-weight: 400; font-size: 2rem; margin: 0 0 1.25rem; }
  #signin label { display: block; font-weight: 600; margin-bottom: .4rem; }
  #signin input { width: 100%; padding: .7rem .8rem; border: 1.5px solid var(--line); border-radius: 2px; margin-bottom: 1rem; }
  #signin input:focus { border-color: var(--teal); }
  .error { color: var(--red); min-height: 1.5em; margin: .25rem 0 1rem; }
  @media (max-width: 760px) { #signin { grid-template-columns: 1fr; } #signin .panel-dark { min-height: 42vh; } }

  /* Library */
  header.bar {
    background: var(--paper); border-bottom: 1px solid var(--line);
    padding: 1rem clamp(1rem, 4vw, 3rem);
    display: flex; align-items: center; gap: .75rem; flex-wrap: wrap;
  }
  header.bar .name { margin-right: auto; color: var(--red); font-weight: 700; letter-spacing: .06em; line-height: 1.05; font-size: .95rem; }
  header.bar .name .logo-fallback span { display: block; font-weight: 400; }
  header.bar .name em { display: block; font-style: normal; color: var(--teal); font-weight: 500; letter-spacing: 0; font-size: .85rem; margin-top: .2rem; }
  .role { font-size: .85rem; color: var(--muted); }

  main { padding: 3rem clamp(1rem, 4vw, 3rem) 4rem; max-width: 70rem; margin: 0 auto; }
  .lib-head { display: flex; align-items: flex-end; gap: 1.5rem; flex-wrap: wrap; margin-bottom: 1.75rem; }
  .lib-head h2 { color: var(--red); font-weight: 400; font-size: clamp(2rem, 4vw, 2.75rem); margin: 0; line-height: 1.1; margin-right: auto; }
  .lib-head h2 .count { color: var(--muted); font-size: .45em; margin-left: .4rem; }
  #search { padding: .6rem .8rem; border: 1.5px solid var(--line); border-radius: 2px; width: min(22rem, 100%); }
  #search:focus { border-color: var(--teal); }

  ol.reports { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--teal); }
  ol.reports li { display: grid; grid-template-columns: 1fr auto; gap: 1.5rem; padding: 1.4rem 0; border-bottom: 1px solid var(--line); align-items: start; }
  .r-title { font-size: 1.2rem; font-weight: 600; color: var(--ink); background: none; border: none; padding: 0; text-align: left; cursor: pointer; }
  .r-title:hover { color: var(--red); text-decoration: underline; text-underline-offset: 4px; }
  .r-summary { font-family: var(--serif); margin: .35rem 0 0; max-width: 62ch; line-height: 1.65; }
  .r-by { margin: .35rem 0 0; font-size: .85rem; color: var(--muted); }
  .r-actions { display: flex; gap: .25rem; flex-wrap: wrap; justify-content: flex-end; }
  @media (max-width: 640px) { ol.reports li { grid-template-columns: 1fr; gap: .5rem; } .r-actions { justify-content: flex-start; } }
  .empty { padding: 2.5rem 1.5rem; color: var(--muted); background: var(--mist); font-family: var(--serif); }

  /* Viewer */
  #viewer { position: fixed; inset: 0; background: var(--paper); display: flex; flex-direction: column; z-index: 20; }
  #viewer .bar { padding: .7rem clamp(1rem, 3vw, 2rem); }
  #viewer-title { margin-right: auto; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  #frame { flex: 1; width: 100%; border: 0; background: var(--paper); }

  /* Upload dialog */
  dialog { border: none; border-radius: 2px; padding: 0; width: min(40rem, 94vw); box-shadow: 0 16px 50px rgba(0,0,0,.25); }
  dialog::backdrop { background: rgba(48,98,107,.6); }
  .dlg-head { padding: 1.25rem 1.5rem .5rem; border-top: 6px solid var(--red); }
  .dlg-head h3 { margin: 0; color: var(--red); font-weight: 400; font-size: 1.6rem; }
  .dlg-body { padding: 1rem 1.5rem 1.5rem; max-height: 65vh; overflow: auto; }
  .dlg-foot { padding: 1rem 1.5rem; display: flex; justify-content: flex-end; gap: .5rem; background: var(--mist); }
  .field { margin-bottom: 1rem; }
  .field label { display: block; font-weight: 600; font-size: .9rem; margin-bottom: .3rem; }
  .field input, .field textarea { width: 100%; padding: .55rem .7rem; border: 1.5px solid var(--line); border-radius: 2px; }
  .field input:focus, .field textarea:focus { border-color: var(--teal); }
  .field textarea { resize: vertical; min-height: 3.5rem; font-family: var(--serif); }
  .drop { display: block; border: 2px dashed var(--teal); padding: 1.5rem; text-align: center; background: var(--mist); color: var(--teal); cursor: pointer; margin-bottom: 1.25rem; }
  .drop.over { background: #DDE9EB; }
  .pending { border-left: 4px solid var(--teal); padding: .75rem 0 .25rem 1rem; margin-bottom: 1rem; }
  .pending .fname { font-size: .85rem; color: var(--muted); margin-bottom: .5rem; display: flex; justify-content: space-between; gap: 1rem; }
  .pending.done { opacity: .6; }
  .pending.failed { border-left-color: var(--red); }

  #toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); background: var(--teal); color: var(--paper); padding: .7rem 1.2rem; border-radius: 2px; z-index: 50; }
</style>
</head>
<body>

<!-- Sign in -->
<section id="signin">
  <div class="panel-dark">
    <div class="logo" style="margin-bottom:auto">
      <img class="logo-img" src="sjn-logo.png" alt="Solutions Journalism Network" onerror="this.parentNode.classList.add('logo-missing')">
      <div class="wordmark logo-fallback">SOLUTIONS<br>JOURNALISM<span>NETWORK</span></div>
    </div>
    <h1>Reports</h1>
    <p>Solutions Journalism Network reports, shared with our team and partners.</p>
  </div>
  <div class="panel-form">
    <form id="signin-form">
      <h2>Sign in</h2>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required autofocus>
      <div class="error" id="signin-error" role="alert"></div>
      <button class="btn" type="submit" id="signin-btn">Sign in</button>
    </form>
  </div>
</section>

<!-- Library -->
<section id="library" hidden>
  <header class="bar">
    <div class="name">
      <div class="logo">
        <img class="logo-img" src="sjn-logo.png" alt="Solutions Journalism Network" onerror="this.parentNode.classList.add('logo-missing')">
        <div class="logo-fallback">SOLUTIONS<br>JOURNALISM<span>NETWORK</span></div>
      </div>
    </div>
    <span class="role" id="role-label"></span>
    <button class="btn" id="upload-open" hidden>Upload reports</button>
    <button class="btn ghost" id="signout">Sign out</button>
  </header>
  <main>
    <div class="lib-head">
      <h2>All reports <span class="count" id="count"></span></h2>
      <input id="search" type="search" placeholder="Search titles and summaries" aria-label="Search reports">
    </div>
    <ol class="reports" id="list"></ol>
    <p class="empty" id="empty" hidden></p>
  </main>
</section>

<!-- Report viewer -->
<section id="viewer" hidden>
  <header class="bar">
    <button class="btn ghost" id="viewer-back">Back to reports</button>
    <div id="viewer-title"></div>
    <button class="btn" id="viewer-download">Download</button>
  </header>
  <!-- sandbox without allow-same-origin: the report's scripts run, but can't read this site's sign-in session -->
  <iframe id="frame" title="Report" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox allow-modals"></iframe>
</section>

<!-- Upload dialog -->
<dialog id="upload-dlg" aria-labelledby="upload-title">
  <div class="dlg-head"><h3 id="upload-title">Upload reports</h3></div>
  <div class="dlg-body">
    <label class="drop" id="drop">
      <input type="file" id="file-input" accept=".html,.htm,text/html" multiple hidden>
      Drop HTML files here, or <u>choose files</u>
    </label>
    <div class="field">
      <label for="uploader-name">Your name</label>
      <input id="uploader-name" type="text" autocomplete="name">
    </div>
    <div id="pending"></div>
  </div>
  <div class="dlg-foot">
    <button class="btn ghost" id="upload-cancel" type="button">Close</button>
    <button class="btn" id="upload-go" type="button" disabled>Upload</button>
  </div>
</dialog>

<div id="toast" role="status" hidden></div>

<script>
// ===== Paste your Apps Script web app URL here (ends in /exec) =====
const API_URL = 'https://script.google.com/macros/s/AKfycbzFiOT7qfw0XekOtyFEopz9gLfnM9RDAfbsncrpNvh-Ibhsu4jciS_xK9a16WS16ay9/exec';

const $ = (id) => document.getElementById(id);
const state = { token: null, role: null, reports: [], current: null, pending: [] };

function store(key, val) {
  try { val == null ? sessionStorage.removeItem(key) : sessionStorage.setItem(key, val); } catch (e) {}
}
function load(key) { try { return sessionStorage.getItem(key); } catch (e) { return null; } }

async function callOnce(method, payload) {
  const opts = { method, credentials: 'omit', redirect: 'follow', cache: 'no-store' };
  let url = API_URL;
  if (method === 'POST') {
    // text/plain avoids a CORS preflight, which Apps Script doesn't support
    opts.headers = { 'Content-Type': 'text/plain;charset=utf-8' };
    opts.body = payload;
  } else {
    url += '?payload=' + encodeURIComponent(payload);
  }
  const res = await fetch(url, opts);
  const text = await res.text();
  try { return JSON.parse(text); }
  catch (e) { return { ok: false, error: 'RETRY' }; } // Google sent a page instead of data
}

async function api(action, data = {}) {
  const payload = JSON.stringify({ action, token: state.token, ...data });
  let out;
  // Google occasionally drops the body of a POST on its way to the script.
  // Retry, then (for everything but uploads, which are too large) send it as a GET instead.
  for (let attempt = 0; attempt < 4; attempt++) {
    const useGet = attempt >= 2 && action !== 'upload';
    out = await callOnce(useGet ? 'GET' : 'POST', payload);
    if (out.error !== 'RETRY') break;
    await new Promise(r => setTimeout(r, 400 * (attempt + 1)));
  }
  if (!out.ok) {
    if (out.error === 'SESSION_EXPIRED') { signOut(true); throw new Error('Your session ended. Sign in again.'); }
    if (out.error === 'RETRY') throw new Error("Couldn't reach the reports server. Please try again in a moment.");
    throw new Error(out.error || 'Something went wrong.');
  }
  return out;
}

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 3000);
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

/* ---------- Sign in / out ---------- */
$('signin-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('signin-btn'); btn.disabled = true; btn.textContent = 'Signing in…';
  $('signin-error').textContent = '';
  try {
    const out = await api('login', { password: $('password').value });
    state.token = out.token; state.role = out.role;
    store('reports_token', out.token); store('reports_role', out.role);
    $('password').value = '';
    showLibrary();
  } catch (err) {
    $('signin-error').textContent = err.message;
  } finally {
    btn.disabled = false; btn.textContent = 'Sign in';
  }
});

function signOut(expired) {
  if (!expired && state.token) api('logout').catch(() => {});
  state.token = null; state.role = null;
  store('reports_token', null); store('reports_role', null);
  $('library').hidden = true; $('viewer').hidden = true; $('signin').hidden = false;
  if (expired) $('signin-error').textContent = 'Your session ended. Sign in again.';
  $('password').focus();
}
$('signout').addEventListener('click', () => signOut(false));

/* ---------- Library ---------- */
async function showLibrary() {
  $('signin').hidden = true; $('library').hidden = false;
  $('upload-open').hidden = state.role !== 'uploader';
  $('role-label').textContent = state.role === 'uploader' ? 'Can upload' : '';
  $('list').innerHTML = '';
  $('empty').hidden = false; $('empty').textContent = 'Loading reports…';
  try {
    const out = await api('list');
    state.reports = out.reports;
    render();
  } catch (err) {
    $('empty').textContent = err.message;
  }
}

function render() {
  const q = $('search').value.trim().toLowerCase();
  const items = state.reports.filter(r =>
    !q || (r.title + ' ' + r.summary + ' ' + r.uploader).toLowerCase().includes(q));
  $('count').textContent = state.reports.length ? state.reports.length : '';
  const list = $('list');
  list.innerHTML = items.map(r => {
    const d = new Date(r.uploaded);
    const when = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    return `<li>
      <div>
        <button class="r-title" data-open="${r.id}">${esc(r.title)}</button>
        ${r.summary ? `<p class="r-summary">${esc(r.summary)}</p>` : ''}
        <p class="r-by">Added ${esc(when)}${r.uploader ? ` by ${esc(r.uploader)}` : ''}</p>
      </div>
      <div class="r-actions">
        <button class="btn link" data-open="${r.id}">Open</button>
        <button class="btn link" data-dl="${r.id}">Download</button>
        ${state.role === 'uploader' ? `<button class="btn link danger" data-del="${r.id}">Delete</button>` : ''}
      </div>
    </li>`;
  }).join('');
  const empty = $('empty');
  if (!state.reports.length) {
    empty.hidden = false;
    empty.textContent = state.role === 'uploader'
      ? 'No reports yet. Use Upload reports to add the first one.'
      : 'No reports have been shared yet. Check back soon.';
  } else if (!items.length) {
    empty.hidden = false; empty.textContent = `No reports match "${q}".`;
  } else {
    empty.hidden = true;
  }
}
$('search').addEventListener('input', render);

$('list').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.open) openReport(b.dataset.open);
  if (b.dataset.dl) downloadReport(b.dataset.dl);
  if (b.dataset.del) deleteReport(b.dataset.del);
});

/* ---------- Viewing ---------- */
const cache = {};
async function fetchReport(id) {
  if (!cache[id]) cache[id] = await api('get', { id });
  return cache[id];
}

async function openReport(id) {
  const r = state.reports.find(x => x.id === id);
  $('viewer-title').textContent = r ? r.title : 'Report';
  $('frame').srcdoc = '<p style="font-family:Figtree,sans-serif;padding:2rem;color:#55686B">Loading report…</p>';
  $('viewer').hidden = false;
  state.current = id;
  $('viewer-back').focus();
  try {
    const out = await fetchReport(id);
    if (state.current === id) $('frame').srcdoc = out.html;
  } catch (err) {
    $('frame').srcdoc = `<p style="font-family:Figtree,sans-serif;padding:2rem;color:#D34435">${esc(err.message)}</p>`;
  }
}
function closeViewer() { $('viewer').hidden = true; $('frame').srcdoc = ''; state.current = null; }
$('viewer-back').addEventListener('click', closeViewer);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('viewer').hidden) closeViewer(); });
$('viewer-download').addEventListener('click', () => state.current && downloadReport(state.current));

async function downloadReport(id) {
  try {
    const out = await fetchReport(id);
    const url = URL.createObjectURL(new Blob([out.html], { type: 'text/html' }));
    const a = document.createElement('a'); a.href = url; a.download = out.fileName || 'report.html';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  } catch (err) { toast(err.message); }
}

async function deleteReport(id) {
  const r = state.reports.find(x => x.id === id);
  if (!confirm(`Delete "${r ? r.title : 'this report'}"? It moves to the Drive trash and can be restored for 30 days.`)) return;
  try {
    await api('delete', { id });
    state.reports = state.reports.filter(x => x.id !== id);
    delete cache[id];
    render(); toast('Report deleted');
  } catch (err) { toast(err.message); }
}

/* ---------- Uploading ---------- */
const dlg = $('upload-dlg');
$('upload-open').addEventListener('click', () => {
  try { $('uploader-name').value = localStorage.getItem('reports_uploader') || ''; } catch (e) {}
  state.pending = []; renderPending(); dlg.showModal();
});
$('upload-cancel').addEventListener('click', () => dlg.close());

const drop = $('drop');
drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', (e) => { e.preventDefault(); drop.classList.remove('over'); addFiles(e.dataTransfer.files); });
$('file-input').addEventListener('change', (e) => { addFiles(e.target.files); e.target.value = ''; });

async function addFiles(fileList) {
  for (const f of fileList) {
    if (!/\.html?$/i.test(f.name)) { toast(`${f.name} isn't an HTML file`); continue; }
    const html = await f.text();
    const m = html.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
    const title = m ? m[1].replace(/\s+/g, ' ').trim() : f.name.replace(/\.html?$/i, '');
    state.pending.push({ key: Math.random().toString(36).slice(2), fileName: f.name, html, title, summary: '', status: '' });
  }
  renderPending();
}

function renderPending() {
  $('pending').innerHTML = state.pending.map(p => `
    <div class="pending ${p.status}" data-key="${p.key}">
      <div class="fname"><span>${esc(p.fileName)}</span><span>${
        p.status === 'done' ? 'Uploaded' : p.status === 'failed' ? esc(p.error) : p.status === 'busy' ? 'Uploading…' :
        '<button class="btn link danger" data-remove="' + p.key + '">Remove</button>'}</span></div>
      <div class="field"><label>Title</label><input data-f="title" value="${esc(p.title)}" ${p.status === 'done' ? 'disabled' : ''}></div>
      <div class="field"><label>Short summary (optional)</label><textarea data-f="summary" ${p.status === 'done' ? 'disabled' : ''}>${esc(p.summary)}</textarea></div>
    </div>`).join('');
  $('upload-go').disabled = !state.pending.some(p => p.status !== 'done');
}

$('pending').addEventListener('input', (e) => {
  const box = e.target.closest('.pending'); const f = e.target.dataset.f;
  const p = state.pending.find(x => x.key === box.dataset.key);
  if (p && f) p[f] = e.target.value;
});
$('pending').addEventListener('click', (e) => {
  const k = e.target.dataset.remove;
  if (k) { state.pending = state.pending.filter(p => p.key !== k); renderPending(); }
});

$('upload-go').addEventListener('click', async () => {
  const uploader = $('uploader-name').value.trim();
  try { localStorage.setItem('reports_uploader', uploader); } catch (e) {}
  $('upload-go').disabled = true;
  let count = 0;
  for (const p of state.pending) {
    if (p.status === 'done') continue;
    p.status = 'busy'; renderPending();
    try {
      await api('upload', { fileName: p.fileName, html: p.html, title: p.title, summary: p.summary, uploader });
      p.status = 'done'; count++;
    } catch (err) {
      p.status = 'failed'; p.error = err.message;
      if (!state.token) break;
    }
    renderPending();
  }
  if (count) {
    toast(`Uploaded ${count} report${count > 1 ? 's' : ''}`);
    const out = await api('list').catch(() => null);
    if (out) { state.reports = out.reports; render(); }
  }
  if (state.pending.every(p => p.status === 'done')) setTimeout(() => dlg.close(), 700);
});

/* ---------- Start ---------- */
state.token = load('reports_token'); state.role = load('reports_role');
if (state.token) showLibrary();
</script>
